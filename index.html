<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lemlem High School | 30 Years of Excellence</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#07090E',
                            800: '#0F172A',
                            700: '#1E293B',
                            600: '#334155',
                        },
                        brand: {
                            blue: '#2563EB',
                            sky: '#38BDF8',
                            cyan: '#06B6D4',
                            accent: '#3B82F6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React, React DOM, Babel, and Framer Motion CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>
<body class="bg-dark-900 text-slate-100 font-sans antialiased selection:bg-brand-blue selection:text-white min-h-screen overflow-x-hidden w-full">

    <!-- React Root -->
    <div id="root"></div>

    <!-- React Application Component Script -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // Data: Timeline
        const timelineData = [
            { year: "1996", title: "Foundation", description: "Lemlem High School was founded with a vision to deliver world-class secondary education." },
            { year: "2006", title: "Campus Expansion", description: "Expanded academic wings and built modern science laboratories for high school students." },
            { year: "2016", title: "Digital Integration", description: "Pioneered interactive smart classrooms and computer science curriculum integration." },
            { year: "2026", title: "30th Anniversary", description: "Celebrating three decades of academic excellence, innovation, and leadership." }
        ];

        // Component: Announcement Bar
        function AnnouncementBar() {
            return (
                <div className="bg-gradient-to-r from-brand-blue via-brand-cyan to-brand-sky p-0.5">
                    <div className="bg-dark-900/90 backdrop-blur-md px-4 py-2 text-center text-xs sm:text-sm font-medium text-slate-200 flex items-center justify-center space-x-2">
                        <span className="bg-brand-blue/20 text-brand-sky border border-brand-blue/30 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider">Milestone</span>
                        <span>Celebrating 30 Years of Lemlem High School Excellence 🎉</span>
                    </div>
                </div>
            );
        }

        // Component: Navbar
        function Navbar() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            return (
                <nav className="sticky top-0 z-50 backdrop-blur-xl bg-dark-900/80 border-b border-white/10 w-full">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-blue to-brand-cyan flex items-center justify-center font-bold text-white text-xl shadow-lg shadow-blue-500/20">
                                L
                            </div>
                            <span className="font-bold text-lg tracking-tight text-white">Lemlem <span className="text-brand-sky font-light">High</span></span>
                        </div>
                        
                        {/* Desktop Links */}
                        <div className="hidden md:flex space-x-8 text-sm font-medium text-slate-300">
                            <a href="#hero" className="hover:text-brand-sky transition-colors">Home</a>
                            <a href="#heritage" className="hover:text-brand-sky transition-colors">30th Heritage</a>
                            <a href="#registration" className="hover:text-brand-sky transition-colors">Admissions</a>
                        </div>
                        
                        <div className="hidden md:block">
                            <a href="#registration" className="bg-brand-blue hover:bg-blue-600 text-white font-semibold text-xs sm:text-sm px-4 py-2 rounded-xl transition-all shadow-md shadow-blue-500/20">
                                Register Now
                            </a>
                        </div>

                        {/* Mobile Toggle Button */}
                        <button 
                            onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                            className="md:hidden p-2 text-slate-300 hover:text-white focus:outline-none">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                {mobileMenuOpen ? (
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                ) : (
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                                )}
                            </svg>
                        </button>
                    </div>

                    {/* Mobile Dropdown */}
                    {mobileMenuOpen && (
                        <div className="md:hidden bg-dark-800 border-b border-white/10 px-4 pt-2 pb-4 space-y-3 text-sm">
                            <a href="#hero" onClick={() => setMobileMenuOpen(false)} className="block text-slate-300 hover:text-white py-1">Home</a>
                            <a href="#heritage" onClick={() => setMobileMenuOpen(false)} className="block text-slate-300 hover:text-white py-1">30th Heritage</a>
                            <a href="#registration" onClick={() => setMobileMenuOpen(false)} className="block text-slate-300 hover:text-white py-1">Admissions</a>
                            <a href="#registration" onClick={() => setMobileMenuOpen(false)} className="block w-full text-center bg-brand-blue text-white font-semibold py-2 rounded-xl">Register Now</a>
                        </div>
                    )}
                </nav>
            );
        }

        // Component: Hero Section
        function Hero() {
            return (
                <section id="hero" className="relative py-16 sm:py-28 overflow-hidden text-center px-4 w-full">
                    {/* Glowing blue background accent - constrained to avoid side scrolling */}
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 sm:w-[500px] h-64 sm:h-[500px] bg-brand-blue/15 blur-[100px] rounded-full pointer-events-none -z-10"></div>
                    
                    <div className="max-w-4xl mx-auto relative z-10">
                        <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.6 }}>
                            <span className="inline-flex items-center space-x-2 px-3 py-1 rounded-full border border-brand-blue/30 bg-brand-blue/10 text-brand-sky text-xs sm:text-sm mb-6">
                                <span>30th Anniversary Edition</span>
                            </span>
                            <h1 className="text-3xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white leading-tight">
                                Three Decades of <br />
                                <span className="bg-gradient-to-r from-brand-blue via-brand-sky to-brand-cyan bg-clip-text text-transparent">
                                    Shaping Tomorrow.
                                </span>
                            </h1>
                            <p className="mt-5 text-slate-400 text-sm sm:text-lg max-w-2xl mx-auto font-normal px-2">
                                Welcome to Lemlem High School's digital portal. Enrolling newcomer and returning students for the upcoming academic year.
                            </p>
                            <div className="mt-8 sm:mt-10 flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-md mx-auto sm:max-w-none">
                                <a href="#registration" className="w-full sm:w-auto bg-brand-blue hover:bg-blue-600 text-white font-semibold px-8 py-3.5 rounded-2xl transition-all shadow-lg shadow-blue-500/25 text-sm sm:text-base">
                                    Student Registration
                                </a>
                                <a href="#heritage" className="w-full sm:w-auto bg-dark-800 hover:bg-dark-700 text-slate-300 border border-white/10 font-semibold px-8 py-3.5 rounded-2xl transition-all text-sm sm:text-base">
                                    Explore Legacy
                                </a>
                            </div>
                        </motion.div>
                    </div>
                </section>
            );
        }

        // Component: Legacy Timeline
        function LegacyTimeline() {
            return (
                <section id="heritage" className="py-16 max-w-5xl mx-auto px-4 w-full">
                    <div className="text-center mb-12">
                        <span className="text-brand-sky font-semibold tracking-widest uppercase text-xs">Our Journey</span>
                        <h2 className="text-2xl sm:text-4xl font-extrabold text-white mt-2">30 Years of Educational Leadership</h2>
                    </div>
                    <div className="space-y-4 sm:space-y-6">
                        {timelineData.map((item, idx) => (
                            <div key={idx} className="bg-dark-800/80 border border-white/10 rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-6 hover:border-brand-blue/40 transition-all">
                                <span className="text-xl sm:text-2xl font-extrabold text-brand-sky font-mono bg-brand-blue/10 px-3 py-1 rounded-xl border border-brand-blue/20">{item.year}</span>
                                <div className="flex-1">
                                    <h3 className="text-base sm:text-lg font-bold text-white">{item.title}</h3>
                                    <p className="text-slate-400 text-xs sm:text-sm mt-1">{item.description}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        // Component: Registration Portal
        function RegistrationPortal() {
            const [tab, setTab] = useState('newcomer');
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            return (
                <section id="registration" className="py-16 max-w-3xl mx-auto px-4 w-full">
                    <div className="bg-dark-800/90 border border-white/10 rounded-3xl p-5 sm:p-10 shadow-2xl backdrop-blur-sm">
                        <div className="text-center mb-8">
                            <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Student Registration</h2>
                            <p className="text-slate-400 text-xs sm:text-sm mt-2">Select your enrollment category below</p>
                            
                            {/* Toggle */}
                            <div className="flex justify-center mt-6">
                                <div className="bg-dark-900 p-1 rounded-xl border border-white/10 flex space-x-1 w-full sm:w-auto">
                                    <button 
                                        onClick={() => { setTab('newcomer'); setSubmitted(false); }} 
                                        className={`flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-lg text-xs sm:text-sm font-semibold transition-all ${tab === 'newcomer' ? 'bg-brand-blue text-white shadow-md shadow-blue-500/20' : 'text-slate-400 hover:text-white'}`}>
                                        Newcomer Student
                                    </button>
                                    <button 
                                        onClick={() => { setTab('returning'); setSubmitted(false); }} 
                                        className={`flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-lg text-xs sm:text-sm font-semibold transition-all ${tab === 'returning' ? 'bg-brand-blue text-white shadow-md shadow-blue-500/20' : 'text-slate-400 hover:text-white'}`}>
                                        Returning Student
                                    </button>
                                </div>
                            </div>
                        </div>

                        {submitted ? (
                            <div className="text-center py-10 space-y-4">
                                <div className="w-16 h-16 bg-brand-blue/20 text-brand-sky rounded-full flex items-center justify-center mx-auto text-2xl font-bold border border-brand-blue/30">✓</div>
                                <h3 className="text-xl font-bold text-white">Registration Submitted!</h3>
                                <p className="text-slate-400 text-xs sm:text-sm">Thank you for registering for Lemlem High School's 30th Anniversary academic year.</p>
                                <button onClick={() => setSubmitted(false)} className="text-brand-sky text-xs sm:text-sm font-semibold hover:underline mt-2">Submit another response</button>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="space-y-4 text-left">
                                {tab === 'newcomer' ? (
                                    <>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Full Student Name</label>
                                            <input required type="text" placeholder="John Doe" className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue" />
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-300 mb-1">Grade Applying For</label>
                                                <select className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue">
                                                    <option>Grade 9</option>
                                                    <option>Grade 10</option>
                                                    <option>Grade 11</option>
                                                    <option>Grade 12</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-300 mb-1">Previous School</label>
                                                <input required type="text" placeholder="School Name" className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Guardian Phone Number</label>
                                            <input required type="tel" placeholder="+251 ..." className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue" />
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Student ID Number</label>
                                            <input required type="text" placeholder="LHS-XXXX" className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                                            <input required type="text" placeholder="John Doe" className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Promoting To Grade</label>
                                            <select className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue">
                                                <option>Grade 10</option>
                                                <option>Grade 11</option>
                                                <option>Grade 12</option>
                                            </select>
                                        </div>
                                    </>
                                )}
                                <button type="submit" className="w-full bg-brand-blue hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-500/25 mt-4 text-sm sm:text-base">
                                    Complete Registration
                                </button>
                            </form>
                        )}
                    </div>
                </section>
            );
        }

        // Main App Layout
        function App() {
            return (
                <div className="min-h-screen flex flex-col justify-between w-full overflow-x-hidden">
                    <div>
                        <AnnouncementBar />
                        <Navbar />
                        <Hero />
                        <LegacyTimeline />
                        <RegistrationPortal />
                    </div>
                    <footer className="border-t border-white/10 py-8 text-center text-xs text-slate-500 px-4">
                        © 1996 - 2026 Lemlem High School. 30 Years of Excellence.
                    </footer>
                </div>
            );
        }

        // Render App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
