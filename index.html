<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemlem High School | 30 Years of Excellence</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#090A0F',
                            800: '#12141C',
                            700: '#1C1F2E',
                            600: '#2A2E43',
                        },
                        brand: {
                            gold: '#D4AF37',
                            emerald: '#10B981',
                            accent: '#6366F1'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React, React DOM, Babel, and Framer Motion CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>
<body class="bg-dark-900 text-slate-100 font-sans antialiased selection:bg-brand-emerald selection:text-white min-h-screen">

    <!-- React Root -->
    <div id="root"></div>

    <!-- React Application Component Script -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // Data: Timeline
        const timelineData = [
            { year: "1996", title: "Foundation", description: "Lemlem High School was founded with a vision to deliver world-class secondary education." },
            { year: "2006", title: "Campus Expansion", description: "Expanded academic wings and built modern science laboratories for high school students." },
            { year: "2016", title: "Digital Integration", description: "Pioneered interactive smart classrooms and computer science curriculum integration." },
            { year: "2026", title: "30th Anniversary", description: "Celebrating three decades of academic excellence, innovation, and leadership." }
        ];

        // Component: Announcement Bar
        function AnnouncementBar() {
            return (
                <div class="bg-gradient-to-r from-brand-emerald via-indigo-600 to-brand-gold p-0.5">
                    <div class="bg-dark-900/90 backdrop-blur-md px-4 py-2 text-center text-xs sm:text-sm font-medium text-slate-200 flex items-center justify-center space-x-2">
                        <span class="bg-brand-gold/20 text-brand-gold px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider">Milestone</span>
                        <span>Celebrating 30 Years of Lemlem High School Excellence 🎉</span>
                    </div>
                </div>
            );
        }

        // Component: Navbar
        function Navbar() {
            return (
                <nav class="sticky top-0 z-50 backdrop-blur-xl bg-dark-900/70 border-b border-white/10">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-emerald to-brand-gold flex items-center justify-center font-bold text-dark-900 text-xl shadow-lg shadow-emerald-500/20">
                                L
                            </div>
                            <span class="font-bold text-lg tracking-tight text-white">Lemlem <span class="text-brand-gold font-light">High</span></span>
                        </div>
                        <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-300">
                            <a href="#hero" class="hover:text-white transition-colors">Home</a>
                            <a href="#heritage" class="hover:text-white transition-colors">30th Heritage</a>
                            <a href="#registration" class="hover:text-white transition-colors">Admissions</a>
                        </div>
                        <a href="#registration" class="bg-white text-dark-900 hover:bg-slate-200 font-semibold text-xs sm:text-sm px-4 py-2 rounded-xl transition-all shadow-md">
                            Register Now
                        </a>
                    </div>
                </nav>
            );
        }

        // Component: Hero Section
        function Hero() {
            return (
                <section id="hero" class="relative py-20 sm:py-32 overflow-hidden text-center px-4">
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-emerald/10 blur-[120px] rounded-full pointer-events-none"></div>
                    <div class="max-w-4xl mx-auto relative z-10">
                        <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.6 }}>
                            <span class="inline-flex items-center space-x-2 px-3 py-1 rounded-full border border-white/10 bg-white/5 text-slate-300 text-xs sm:text-sm mb-6">
                                <span>30th Anniversary Edition</span>
                            </span>
                            <h1 class="text-4xl sm:text-7xl font-extrabold tracking-tight text-white leading-tight">
                                Three Decades of <br />
                                <span class="bg-gradient-to-r from-brand-emerald via-teal-300 to-brand-gold bg-clip-text text-transparent">
                                    Shaping Tomorrow.
                                </span>
                            </h1>
                            <p class="mt-6 text-slate-400 text-base sm:text-xl max-w-2xl mx-auto font-normal">
                                Welcome to Lemlem High School's digital portal. Enrolling newcomer and returning students for the upcoming academic year.
                            </p>
                            <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                                <a href="#registration" class="w-full sm:w-auto bg-brand-emerald hover:bg-emerald-600 text-white font-semibold px-8 py-3.5 rounded-2xl transition-all shadow-lg shadow-emerald-500/25">
                                    Student Registration
                                </a>
                                <a href="#heritage" class="w-full sm:w-auto bg-dark-800 hover:bg-dark-700 text-slate-300 border border-white/10 font-semibold px-8 py-3.5 rounded-2xl transition-all">
                                    Explore Legacy
                                </a>
                            </div>
                        </motion.div>
                    </div>
                </section>
            );
        }

        // Component: Legacy Timeline
        function LegacyTimeline() {
            return (
                <section id="heritage" class="py-20 max-w-5xl mx-auto px-4">
                    <div class="text-center mb-16">
                        <span class="text-brand-gold font-semibold tracking-widest uppercase text-xs">Our Journey</span>
                        <h2 class="text-3xl sm:text-4xl font-extrabold text-white mt-2">30 Years of Educational Leadership</h2>
                    </div>
                    <div class="space-y-6">
                        {timelineData.map((item, idx) => (
                            <div key={idx} class="bg-dark-800/60 border border-white/10 rounded-2xl p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                <span class="text-2xl font-extrabold text-brand-gold font-mono">{item.year}</span>
                                <div class="flex-1">
                                    <h3 class="text-lg font-bold text-white">{item.title}</h3>
                                    <p class="text-slate-400 text-sm mt-1">{item.description}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        // Component: Registration Portal
        function RegistrationPortal() {
            const [tab, setTab] = useState('newcomer');
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            return (
                <section id="registration" class="py-20 max-w-3xl mx-auto px-4">
                    <div class="bg-dark-800 border border-white/10 rounded-3xl p-6 sm:p-10 shadow-2xl">
                        <div class="text-center mb-8">
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Student Registration</h2>
                            <p class="text-slate-400 text-sm mt-2">Select your enrollment category below</p>
                            
                            {/* Toggle */}
                            <div class="flex justify-center mt-6">
                                <div class="bg-dark-900 p-1 rounded-xl border border-white/10 flex space-x-1">
                                    <button 
                                        onClick={() => { setTab('newcomer'); setSubmitted(false); }} 
                                        class={`px-5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${tab === 'newcomer' ? 'bg-brand-emerald text-white' : 'text-slate-400'}`}>
                                        Newcomer Student
                                    </button>
                                    <button 
                                        onClick={() => { setTab('returning'); setSubmitted(false); }} 
                                        class={`px-5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${tab === 'returning' ? 'bg-brand-emerald text-white' : 'text-slate-400'}`}>
                                        Returning Student
                                    </button>
                                </div>
                            </div>
                        </div>

                        {submitted ? (
                            <div class="text-center py-10 space-y-4">
                                <div class="w-16 h-16 bg-brand-emerald/20 text-brand-emerald rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
                                <h3 class="text-xl font-bold text-white">Registration Submitted!</h3>
                                <p class="text-slate-400 text-sm">Thank you for registering for Lemlem High School's 30th Anniversary academic year.</p>
                                <button onClick={() => setSubmitted(false)} class="text-brand-emerald text-sm font-semibold hover:underline">Submit another response</button>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} class="space-y-4 text-left">
                                {tab === 'newcomer' ? (
                                    <>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Full Student Name</label>
                                            <input required type="text" placeholder="John Doe" class="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-emerald" />
                                        </div>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label class="block text-xs font-medium text-slate-300 mb-1">Grade Applying For</label>
                                                <select class="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-emerald">
                                                    <option>Grade 9</option>
                                                    <option>Grade 10</option>
                                                    <option>Grade 11</option>
                                                    <option>Grade 12</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-slate-300 mb-1">Previous School</label>
                                                <input required type="text" placeholder="School Name" class="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-emerald" />
                                            </div>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Guardian Phone Number</label>
                                            <input required type="tel" placeholder="+251 ..." class="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-emerald" />
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Student ID Number</label>
                                            <input required type="text" placeholder="LHS-XXXX" class="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-emerald" />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                                            <input required type="text" placeholder="John Doe" class="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-emerald" />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Promoting To Grade</label>
                                            <select class="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-emerald">
                                                <option>Grade 10</option>
                                                <option>Grade 11</option>
                                                <option>Grade 12</option>
                                            </select>
                                        </div>
                                    </>
                                )}
                                <button type="submit" class="w-full bg-brand-emerald hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 mt-4">
                                    Complete Registration
                                </button>
                            </form>
                        )}
                    </div>
                </section>
            );
        }

        // Main App Layout
        function App() {
            return (
                <div class="min-h-screen flex flex-col justify-between">
                    <div>
                        <AnnouncementBar />
                        <Navbar />
                        <Hero />
                        <LegacyTimeline />
                        <RegistrationPortal />
                    </div>
                    <footer class="border-t border-white/10 py-8 text-center text-xs text-slate-500">
                        © 1996 - 2026 Lemlem High School. 30 Years of Excellence.
                    </footer>
                </div>
            );
        }

        // Render App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
