function submitFormsubmitWithFiles(targetUrl, fields, files) {
  return new Promise((resolve, reject) => {
    try {
      const iframeName = 'fs_iframe_' + Date.now();
      const iframe = document.createElement('iframe');
      iframe.name = iframeName;
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      const form = document.createElement('form');
      form.action = targetUrl;
      form.method = 'POST';
      form.enctype = 'multipart/form-data';
      form.target = iframeName;
      form.style.display = 'none';

      // Disable FormSubmit default captcha redirect if configured
      const captchaInput = document.createElement('input');
      captchaInput.type = 'hidden';
      captchaInput.name = '_captcha';
      captchaInput.value = 'false';
      form.appendChild(captchaInput);

      // Append text inputs
      Object.entries(fields).forEach(([key, val]) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = val || '';
        form.appendChild(input);
      });

      // Append file inputs via DataTransfer
      Object.entries(files).forEach(([key, fileObj]) => {
        if (fileObj) {
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.name = key;

          const dt = new DataTransfer();
          dt.items.add(fileObj);
          fileInput.files = dt.files;

          form.appendChild(fileInput);
        }
      });

      document.body.appendChild(form);

      iframe.onload = () => {
        setTimeout(() => {
          if (document.body.contains(form)) document.body.removeChild(form);
          if (document.body.contains(iframe)) document.body.removeChild(iframe);
        }, 500);
        resolve();
      };

      form.submit();
    } catch (err) {
      reject(err);
    }
  });
}

function Reveal({ children, className = "", delay = 0, style = {}, direction = "up" }) {
  const [isVisible, setIsVisible] = useState(false);
  const domRef = useRef(null);

  useEffect(() => {
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setIsVisible(true);
          if (domRef.current) observer.unobserve(domRef.current);
        }
      },
      { threshold: 0.12, rootMargin: "0px 0px -40px 0px" }
    );

    const { current } = domRef;
    if (current) observer.observe(current);

    return () => {
      if (current) observer.unobserve(current);
    };
  }, []);

  return (
    <div
      ref={domRef}
      className={`reveal-box ${direction} ${isVisible ? "is-visible" : ""} ${className}`}
      style={{ transitionDelay: `${delay}ms`, ...style }}
    >
      {children}
    </div>
  );
}

function useCountUp(target, duration = 1400, start = true) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!start) return;
    let raf;
    let startTs = null;
    function tick(ts) {
      if (startTs === null) startTs = ts;
      const progress = Math.min((ts - startTs) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setValue(Math.floor(eased * target));
      if (progress < 1) raf = requestAnimationFrame(tick);
      else setValue(target);
    }
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
  }, [target, duration, start]);
  return value;
}

function useSpotlight() {
  const ref = useRef(null);
  const onMouseMove = useCallback((e) => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    el.style.setProperty("--mx", `${e.clientX - rect.left}px`);
    el.style.setProperty("--my", `${e.clientY - rect.top}px`);
  }, []);
  return { ref, onMouseMove };
}

const STEP_LABELS = ["Student & grade", "Guardian details", "Documents", "Payment & Fee"];

function ProgressRail({ step }) {
  return (
    <div className="flex items-center" style={{ marginBottom: "30px" }}>
      {STEP_LABELS.map((label, i) => {
        const n = i + 1;
        const state = n < step ? "done" : n === step ? "active" : "todo";
        return (
          <Fragment key={label}>
            <div className="flex items-center" style={{ gap: "9px" }}>
              <span className={`step-dot lhs-mono ${state}`}>{state === "done" ? <Check size={12} /> : n}</span>
              <span className={`text-${state === "todo" ? "tertiary" : "primary"} hidden sm:inline transition-colors duration-300`} style={{ fontSize: "13px" }}>
                {label}
              </span>
            </div>
            {n !== STEP_LABELS.length && <span className={`step-line ${state === "done" ? "done" : ""}`} />}
          </Fragment>
        );
      })}
    </div>
  );
}

function Field({ label, error, children }) {
  return (
    <label className="field-wrap" style={{ display: "block", marginBottom: "16px" }}>
      <span className="text-secondary" style={{ fontSize: "13px", display: "block", marginBottom: "7px" }}>
        {label}
      </span>
      {children}
      {error && (
        <span className="flex items-center error-text animate-fade-in" style={{ gap: "5px", marginTop: "6px", fontSize: "12px" }}>
          <X size={12} /> {error}
        </span>
      )}
    </label>
  );
}

function RegistrationPortal() {
  const [mode, setMode] = useState("new");
  const [step, setStep] = useState(1);
  const [errors, setErrors] = useState({});
  const [appId, setAppId] = useState(null);
  const [dragKey, setDragKey] = useState(null);
  const [isSubmitted, setIsSubmitted] = useState(false);
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);
  const [form, setForm] = useState({
    fullName: "",
    dob: "",
    grade: "",
    previousSchool: "",
    studentId: "",
    guardianName: "",
    relationship: "",
    phone: "",
    email: "",
    address: "",
  });
  const [files, setFiles] = useState({});
  const timers = useRef({});

  function set(key, value) {
    setForm((f) => ({ ...f, [key]: value }));
  }

  useEffect(() => {
    if (step === 4 && !appId) setAppId(genAppId());
  }, [step, appId]);

  useEffect(() => {
    return () => Object.values(timers.current).forEach(clearInterval);
  }, []);

  function simulateUpload(key, fileObj) {
    setFiles((f) => ({ ...f, [key]: { name: fileObj.name, rawFile: fileObj, progress: 0 } }));
    if (timers.current[key]) clearInterval(timers.current[key]);
    let p = 0;
    timers.current[key] = setInterval(() => {
      p += Math.random() * 26 + 12;
      if (p >= 100) {
        p = 100;
        clearInterval(timers.current[key]);
      }
      setFiles((f) => ({ ...f, [key]: { ...f[key], progress: Math.round(p) } }));
    }, 220);
  }

  function handleDrop(e, key) {
    e.preventDefault();
    setDragKey(null);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) simulateUpload(key, file);
  }

  function handleBrowse(e, key) {
    const file = e.target.files && e.target.files[0];
    if (file) simulateUpload(key, file);
  }

  function validateStep(n) {
    const e = {};
    if (n === 1) {
      if (!form.fullName.trim()) e.fullName = "Enter the student's full name.";
      if (!form.dob) e.dob = "Select a date of birth.";
      if (!form.grade) e.grade = "Choose a grade.";
      if (mode === "new" && !form.previousSchool.trim()) e.previousSchool = "Enter the previous school.";
      if (mode === "returning" && !form.studentId.trim()) e.studentId = "Enter the existing student ID.";
    }
    if (n === 2) {
      if (!form.guardianName.trim()) e.guardianName = "Enter a guardian's full name.";
      if (!form.relationship.trim()) e.relationship = "Enter the relationship to student.";
      if (!/^[+0-9 ()-]{7,}$/.test(form.phone)) e.phone = "Enter a valid phone number.";
      if (!/^\S+@\S+\.\S+$/.test(form.email)) e.email = "Enter a valid email address.";
      if (!form.address.trim()) e.address = "Enter a home address.";
    }
    if (n === 3) {
      DOCS.forEach((d) => {
        if (!files[d.key] || files[d.key].progress < 100) e[d.key] = "Upload this document to continue.";
      });
    }
    if (n === 4) {
      if (!files["receipt"] || files["receipt"].progress < 100) {
        e.receipt = "Please upload the bank deposit or transfer receipt of 5,340 ETB.";
      }
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function handleSubmitApplication() {
    if (!validateStep(4)) return;

    setIsSubmitting(true);
    setSubmitError(null);

    try {
      const textFields = {
        "Application Type": mode === "new" ? "New Student Application" : "Returning Student Re-registration",
        "Application ID": appId || genAppId(),
        "Student Name": form.fullName,
        "Date of Birth": form.dob,
        "Grade": form.grade,
        [mode === "new" ? "Previous School" : "Student ID"]: mode === "new" ? form.previousSchool : form.studentId,
        "Guardian Name": form.guardianName,
        "Relationship": form.relationship,
        "Phone Number": form.phone,
        "Email": form.email,
        "Home Address": form.address,
      };

      const fileFields = {};
      if (files["transcript"]?.rawFile) fileFields["Transcript"] = files["transcript"].rawFile;
      if (files["id"]?.rawFile) fileFields["ID_Document"] = files["id"].rawFile;
      if (files["photo"]?.rawFile) fileFields["Passport_Photo"] = files["photo"].rawFile;
      if (files["receipt"]?.rawFile) fileFields["Payment_Receipt"] = files["receipt"].rawFile;

      await submitFormsubmitWithFiles(
        "https://formsubmit.co/asfawlemlemschool@gmail.com",
        textFields,
        fileFields
      );

      setIsSubmitted(true);
    } catch (err) {
      setSubmitError("Failed to submit application. Please check your connection and try again.");
    } finally {
      setIsSubmitting(false);
    }
  }

  function next() {
    if (validateStep(step)) {
      if (step === 4) {
        handleSubmitApplication();
      } else {
        setStep((s) => Math.min(s + 1, 4));
      }
    }
  }
  function back() {
    setErrors({});
    setSubmitError(null);
    setStep((s) => Math.max(s - 1, 1));
  }
  function restart() {
    setStep(1);
    setAppId(null);
    setIsSubmitted(false);
    setIsSubmitting(false);
    setSubmitError(null);
    setErrors({});
    setFiles({});
    setForm({
      fullName: "",
      dob: "",
      grade: "",
      previousSchool: "",
      studentId: "",
      guardianName: "",
      relationship: "",
      phone: "",
      email: "",
      address: "",
    });
  }

  return (
    <section id="admissions" style={{ padding: "80px 20px" }}>
      <div className="max-w-7xl mx-auto">
        <div className="grid lg:grid-cols-12" style={{ gap: "40px" }}>
          <Reveal className="lg:col-span-4" style={{ gridColumn: "span 4" }}>
            <SectionEyebrow>2026/27 admissions</SectionEyebrow>
            <h2 className="text-primary" style={{ fontSize: "clamp(1.9rem, 3.2vw, 2.4rem)", fontWeight: 600, letterSpacing: "-0.02em", marginTop: "10px" }}>
              Registration, built like software.
            </h2>
            <p className="text-secondary" style={{ fontSize: "14.5px", lineHeight: 1.65, marginTop: "12px", maxWidth: "360px" }}>
              Four short steps, autosaved as you go. New applicants and returning
              students follow the same clean flow.
            </p>
            <div style={{ marginTop: "24px" }}>
              {["Reviewed within 3 business days", "SMS + email confirmation", "No paper forms required"].map((t) => (
                <div key={t} className="flex items-center text-tertiary" style={{ gap: "8px", fontSize: "13px", marginBottom: "10px" }}>
                  <ShieldCheck size={14} className="text-accent" />
                  {t}
                </div>
              ))}
            </div>
          </Reveal>

          <Reveal className="lg:col-span-8 glass" delay={200} style={{ gridColumn: "span 8", borderRadius: "20px", padding: "28px" }}>
            <div className="segmented">
              <button
                className={`segment lhs-mono ${mode === "new" ? "active" : ""}`}
                onClick={() => {
                  setMode("new");
                  setErrors({});
                }}
              >
                New student application
              </button>
              <button
                className={`segment lhs-mono ${mode === "returning" ? "active" : ""}`}
                onClick={() => {
                  setMode("returning");
                  setErrors({});
                }}
              >
                Returning student re-registration
              </button>
            </div>

            <div style={{ marginTop: "26px" }}>
              <ProgressRail step={step} />
            </div>

            <div key={step} className="animate-fade-in-up">
              {step === 1 && (
                <div>
                  <Field label="Student full name" error={errors.fullName}>
                    <input
                      className={`field ${errors.fullName ? "error" : ""}`}
                      placeholder="e.g. Selamawit Bekele"
                      value={form.fullName}
                      onChange={(e) => set("fullName", e.target.value)}
                    />
                  </Field>

                  <div className="grid sm:grid-cols-2" style={{ gap: "0 16px" }}>
                    <Field label="Date of birth" error={errors.dob}>
                      <input type="date" className={`field ${errors.dob ? "error" : ""}`} value={form.dob} onChange={(e) => set("dob", e.target.value)} />
                    </Field>
                    <Field label={mode === "new" ? "Previous school" : "Existing student ID"} error={mode === "new" ? errors.previousSchool : errors.studentId}>
                      {mode === "new" ? (
                        <input
                          className={`field ${errors.previousSchool ? "error" : ""}`}
                          placeholder="e.g. Bole Elementary School"
                          value={form.previousSchool}
                          onChange={(e) => set("previousSchool", e.target.value)}
                        />
                      ) : (
                        <input
                          className={`field lhs-mono ${errors.studentId ? "error" : ""}`}
                          placeholder="e.g. LHS-2023-04812"
                          value={form.studentId}
                          onChange={(e) => set("studentId", e.target.value)}
                        />
                      )}
                    </Field>
                  </div>

                  <span className="text-secondary" style={{ fontSize: "13px", display: "block", marginBottom: "10px" }}>
                    Grade for 2026/27
                  </span>
                  <div className="flex flex-wrap" style={{ gap: "8px", marginBottom: errors.grade ? "6px" : "0" }}>
                    {GRADES.map((g) => (
                      <button key={g} onClick={() => set("grade", g)} className={`grade-chip lhs-mono ${form.grade === g ? "active" : ""}`}>
                        Grade {g}
                      </button>
                    ))}
                  </div>
                  {errors.grade && (
                    <span className="flex items-center error-text animate-fade-in" style={{ gap: "5px", marginTop: "8px", fontSize: "12px" }}>
                      <X size={12} /> {errors.grade}
                    </span>
                  )}
                </div>
              )}

              {step === 2 && (
                <div>
                  <div className="grid sm:grid-cols-2" style={{ gap: "0 16px" }}>
                    <Field label="Guardian full name" error={errors.guardianName}>
                      <input
                        className={`field ${errors.guardianName ? "error" : ""}`}
                        placeholder="e.g. Almaz Tesfaye"
                        value={form.guardianName}
                        onChange={(e) => set("guardianName", e.target.value)}
                      />
                    </Field>
                    <Field label="Relationship to student" error={errors.relationship}>
                      <input
                        className={`field ${errors.relationship ? "error" : ""}`}
                        placeholder="e.g. Mother, Father, Guardian"
                        value={form.relationship}
                        onChange={(e) => set("relationship", e.target.value)}
                      />
                    </Field>
                  </div>
                  <div className="grid sm:grid-cols-2" style={{ gap: "0 16px" }}>
                    <Field label="Phone number" error={errors.phone}>
                      <input
                        className={`field lhs-mono ${errors.phone ? "error" : ""}`}
                        placeholder="+251 9XX XXX XXX"
                        value={form.phone}
                        onChange={(e) => set("phone", e.target.value)}
                      />
                    </Field>
                    <Field label="Email address" error={errors.email}>
                      <input
                        className={`field ${errors.email ? "error" : ""}`}
                        placeholder="name@example.com"
                        value={form.email}
                        onChange={(e) => set("email", e.target.value)}
                      />
                    </Field>
                  </div>
                  <Field label="Home address" error={errors.address}>
                    <input
                      className={`field ${errors.address ? "error" : ""}`}
                      placeholder="Sub-city, woreda, house number"
                      value={form.address}
                      onChange={(e) => set("address", e.target.value)}
                    />
                  </Field>
                </div>
              )}

              {step === 3 && (
                <div>
                  {DOCS.map((d) => {
                    const f = files[d.key];
                    return (
                      <div
                        key={d.key}
                        onDragOver={(e) => {
                          e.preventDefault();
                          setDragKey(d.key);
                        }}
                        onDragLeave={() => setDragKey(null)}
                        onDrop={(e) => handleDrop(e, d.key)}
                        className={`dropzone ${dragKey === d.key ? "drag" : ""} ${errors[d.key] ? "error" : ""}`}
                        style={{ marginBottom: "12px", padding: "16px" }}
                      >
                        <div className="flex items-center justify-between">
                          <div className="flex items-center" style={{ gap: "12px" }}>
                            <span className="doc-icon">
                              <FileText size={16} className="text-accent" />
                            </span>
                            <div>
                              <div className="text-primary" style={{ fontSize: "13.5px", fontWeight: 500 }}>
                                {d.label}
                              </div>
                              <div className="text-tertiary" style={{ fontSize: "12px" }}>
                                {f ? f.name : d.hint}
                              </div>
                            </div>
                          </div>
                          <label className="btn-glass upload-btn lhs-mono">
                            <UploadCloud size={13} />
                            {f && f.progress === 100 ? "Replace" : "Browse"}
                            <input type="file" accept="image/*,.pdf" style={{ display: "none" }} onChange={(e) => handleBrowse(e, d.key)} />
                          </label>
                        </div>
                        {f && (
                          <div className="upload-track" style={{ marginTop: "12px" }}>
                            <div className="upload-fill" style={{ width: `${f.progress}%` }} />
                          </div>
                        )}
                        {errors[d.key] && (
                          <span className="flex items-center error-text animate-fade-in" style={{ gap: "5px", marginTop: "8px", fontSize: "12px" }}>
                            <X size={12} /> {errors[d.key]}
                          </span>
                        )}
                      </div>
                    );
                  })}
                  <p className="text-tertiary" style={{ fontSize: "12px", marginTop: "4px" }}>
                    Drag a file onto any box, or use Browse. Accepted: PDF, JPG, PNG — up to 10MB.
                  </p>
                </div>
              )}

              {step === 4 && !isSubmitted && (
                <div>
                  <div className="glass" style={{ borderRadius: "12px", padding: "18px", marginBottom: "20px", border: "1px solid var(--border-glass-hover)" }}>
                    <div className="flex items-center justify-between" style={{ marginBottom: "12px" }}>
                      <div className="flex items-center" style={{ gap: "10px" }}>
                        <span className="doc-icon" style={{ background: "rgba(16, 185, 129, 0.2)" }}>
                          <CreditCard size={18} className="text-accent" />
                        </span>
                        <div>
                          <div className="text-primary" style={{ fontSize: "15px", fontWeight: 600 }}>
                            Registration Fee Requirement
                          </div>
                          <div className="text-tertiary" style={{ fontSize: "12px" }}>
                            Academic Year 2026/27 Tuition Deposit
                          </div>
                        </div>
                      </div>
                      <div className="lhs-mono gradient-text" style={{ fontSize: "20px", fontWeight: 700 }}>
                        5,340 ETB
                      </div>
                    </div>

                    <div style={{ fontSize: "13px", lineHeight: 1.6, color: "var(--text-secondary)", borderTop: "1px dashed var(--border-glass)", paddingTop: "12px" }}>
                      Please deposit or transfer <strong className="text-primary">5,340 Birr</strong> to the school bank account below and upload your transaction receipt:
                      <div className="grid sm:grid-cols-2 lhs-mono text-xs" style={{ gap: "8px", marginTop: "10px", background: "rgba(2, 6, 4, 0.5)", padding: "10px", borderRadius: "8px" }}>
                        <div><span className="text-tertiary">Bank:</span> Commercial Bank of Ethiopia</div>
                        <div><span className="text-tertiary">Account Name:</span> Lemlem High School</div>
                        <div><span className="text-tertiary">Account No:</span> 1000123456789</div>
                        <div><span className="text-tertiary">CBE Birr:</span> 0911000000</div>
                      </div>
                    </div>
                  </div>

                  <span className="text-secondary" style={{ fontSize: "13px", display: "block", marginBottom: "8px" }}>
                    Upload Payment Receipt / Deposit Slip
                  </span>
                  <div
                    onDragOver={(e) => {
                      e.preventDefault();
                      setDragKey("receipt");
                    }}
                    onDragLeave={() => setDragKey(null)}
                    onDrop={(e) => handleDrop(e, "receipt")}
                    className={`dropzone ${dragKey === "receipt" ? "drag" : ""} ${errors.receipt ? "error" : ""}`}
                    style={{ padding: "20px" }}
                  >
                    <div className="flex items-center justify-between">
                      <div className="flex items-center" style={{ gap: "12px" }}>
                        <span className="doc-icon">
                          <Receipt size={18} className="text-accent" />
                        </span>
                        <div>
                          <div className="text-primary" style={{ fontSize: "14px", fontWeight: 500 }}>
                            Bank Receipt / Transfer Confirmation
                          </div>
                          <div className="text-tertiary" style={{ fontSize: "12px" }}>
                            {files["receipt"] ? files["receipt"].name : "PNG, JPG, or PDF (Receipt showing 5,340 ETB)"}
                          </div>
                        </div>
                      </div>
                      <label className="btn-glass upload-btn lhs-mono">
                        <UploadCloud size={13} />
                        {files["receipt"] && files["receipt"].progress === 100 ? "Replace Receipt" : "Upload Receipt"}
                        <input type="file" accept="image/*,.pdf" style={{ display: "none" }} onChange={(e) => handleBrowse(e, "receipt")} />
                      </label>
                    </div>
                    {files["receipt"] && (
                      <div className="upload-track" style={{ marginTop: "14px" }}>
                        <div className="upload-fill" style={{ width: `${files["receipt"].progress}%` }} />
                      </div>
                    )}
                    {errors.receipt && (
                      <span className="flex items-center error-text animate-fade-in" style={{ gap: "5px", marginTop: "10px", fontSize: "12px" }}>
                        <X size={12} /> {errors.receipt}
                      </span>
                    )}
                  </div>
                  {submitError && (
                    <span className="flex items-center error-text animate-fade-in" style={{ gap: "5px", marginTop: "12px", fontSize: "13px" }}>
                      <X size={14} /> {submitError}
                    </span>
                  )}
                </div>
              )}

              {step === 4 && isSubmitted && (
                <div className="ticket animate-scale-up">
                  <div className="flex items-center justify-between" style={{ marginBottom: "18px" }}>
                    <div className="flex items-center" style={{ gap: "10px" }}>
                      <span className="ticket-check">
                        <CheckCircle2 size={18} />
                      </span>
                      <div>
                        <div className="text-primary" style={{ fontSize: "15px", fontWeight: 600 }}>
                          Application & Payment Received
                        </div>
                        <div className="text-tertiary" style={{ fontSize: "12px" }}>
                          Status: receipt pending verification
                        </div>
                      </div>
                    </div>
                    <span className="lhs-mono text-accent" style={{ fontSize: "13px" }}>
                      {appId}
                    </span>
                  </div>

                  <div className="ticket-divider" />

                  <div className="grid sm:grid-cols-2" style={{ gap: "14px 24px", padding: "18px 0" }}>
                    {[
                      ["Applicant", form.fullName || "—"],
                      ["Grade", form.grade ? `Grade ${form.grade}` : "—"],
                      ["Track", mode === "new" ? "New student" : "Returning student"],
                      ["Guardian", form.guardianName || "—"],
                      ["Phone", form.phone || "—"],
                      ["Registration Fee", "5,340 ETB (Attached)"],
                    ].map(([label, val]) => (
                      <div key={label}>
                        <div className="text-tertiary" style={{ fontSize: "11.5px", marginBottom: "3px" }}>
                          {label}
                        </div>
                        <div className="text-primary" style={{ fontSize: "13.5px" }}>
                          {val}
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="ticket-divider" />

                  <div className="flex items-center text-tertiary" style={{ gap: "8px", fontSize: "12px", paddingTop: "16px" }}>
                    <Calendar size={13} />A confirmation has been sent — decisions & receipt validation are shared within 3 business days.
                  </div>
                </div>
              )}
            </div>

            <div className="flex items-center justify-between" style={{ marginTop: "26px" }}>
              {step > 1 && !isSubmitted ? (
                <button onClick={back} disabled={isSubmitting} className="btn-glass flex items-center" style={{ padding: "10px 16px", gap: "6px", fontSize: "13.5px" }}>
                  <ChevronLeft size={15} /> Back
                </button>
              ) : (
                <span />
              )}

              {step < 4 && (
                <button onClick={next} className="btn-primary flex items-center" style={{ padding: "10px 18px", gap: "6px", fontSize: "13.5px" }}>
                  Continue <ChevronRight size={15} />
                </button>
              )}
              {step === 4 && !isSubmitted && (
                <button onClick={next} disabled={isSubmitting} className="btn-primary flex items-center" style={{ padding: "10px 18px", gap: "6px", fontSize: "13.5px", opacity: isSubmitting ? 0.7 : 1 }}>
                  {isSubmitting ? (
                    <>
                      <Loader2 size={16} className="animate-spin" /> Submitting...
                    </>
                  ) : (
                    <>
                      Submit application &amp; receipt <ChevronRight size={15} />
                    </>
                  )}
                </button>
              )}
              {isSubmitted && (
                <button onClick={restart} className="btn-glass flex items-center" style={{ padding: "10px 16px", gap: "6px", fontSize: "13.5px", marginLeft: "auto" }}>
                  Start a new application
                </button>
              )}
            </div>
          </Reveal>
        </div>
      </div>
    </section>
  );
}

/*  Monthly School Fee Payment Section                                */

function MonthlyPaymentSection() {
  const [studentId, setStudentId] = useState("");
  const [studentName, setStudentName] = useState("");
  const [grade, setGrade] = useState("9");
  const [selectedMonth, setSelectedMonth] = useState("Meskerem (Sept)");
  const [selectedBank, setSelectedBank] = useState("cbe");
  const [copied, setCopied] = useState(false);
  const [includeBus, setIncludeBus] = useState(false);
  const [includeMeals, setIncludeMeals] = useState(false);
  const [refNum, setRefNum] = useState("");
  const [receiptFile, setReceiptFile] = useState(null);
  const [uploadProgress, setUploadProgress] = useState(0);
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [receiptRef, setReceiptRef] = useState("");
  const [errors, setErrors] = useState({});

  const activeBank = PAYMENT_METHODS.find((b) => b.id === selectedBank) || PAYMENT_METHODS[0];

  const baseTuition = FEE_STRUCTURE[grade] || 4200;
  const busFee = includeBus ? 1200 : 0;
  const mealFee = includeMeals ? 1500 : 0;
  const totalAmount = baseTuition + busFee + mealFee;

  function handleCopy(text) {
    navigator.clipboard.writeText(text);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  }

  function handleFileSelect(e) {
    const file = e.target.files?.[0];
    if (file) {
      setReceiptFile(file);
      setUploadProgress(0);
      let p = 0;
      const interval = setInterval(() => {
        p += 25;
        setUploadProgress(p);
        if (p >= 100) clearInterval(interval);
      }, 150);
    }
  }

  async function handlePaymentSubmit(e) {
    e.preventDefault();
    const errs = {};
    if (!studentId.trim()) errs.studentId = "Student ID is required";
    if (!studentName.trim()) errs.studentName = "Student Name is required";
    if (!refNum.trim()) errs.refNum = "Transaction reference number is required";
    if (!receiptFile) errs.receiptFile = "Please attach proof of payment";

    if (Object.keys(errs).length > 0) {
      setErrors(errs);
      return;
    }

    setSubmitting(true);
    setErrors({});

    try {
      const textFields = {
        "Form Type": "Monthly Fee Payment",
        "Student ID": studentId,
        "Student Name": studentName,
        "Grade": grade,
        "Payment Month": selectedMonth,
        "Base Tuition": `${baseTuition} ETB`,
        "Bus Service": includeBus ? "Yes (1,200 ETB)" : "No",
        "Meal Plan": includeMeals ? "Yes (1,500 ETB)" : "No",
        "Total Paid Amount": `${totalAmount} ETB`,
        "Payment Method": activeBank.name,
        "Transaction Ref Number": refNum,
      };

      const fileFields = {};
      if (receiptFile) fileFields["Payment_Receipt"] = receiptFile;

      await submitFormsubmitWithFiles(
        "https://formsubmit.co/asfawlemlemschool@gmail.com",
        textFields,
        fileFields
      );

      setReceiptRef(genReceiptRef());
      setSubmitted(true);
    } catch (err) {
      setErrors({ submit: "Submission failed. Please check your connection." });
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <section id="monthly-payment" className="grid-bg" style={{ borderTop: "1px solid var(--border-glass)", padding: "80px 20px" }}>
      <div className="max-w-7xl mx-auto">
        <Reveal>
          <div className="flex flex-col md:flex-row md:items-end justify-between" style={{ marginBottom: "36px" }}>
            <div>
              <SectionEyebrow>Student Finance Portal</SectionEyebrow>
              <h2 className="text-primary" style={{ fontSize: "clamp(1.9rem, 3.4vw, 2.6rem)", fontWeight: 600, letterSpacing: "-0.02em", marginTop: "10px" }}>
                Monthly School Fee Payment
              </h2>
              <p className="text-secondary" style={{ fontSize: "15px", marginTop: "8px", maxWidth: "520px" }}>
                Pay monthly tuition, transportation, and meal services directly via CBE, Telebirr, or major local banks.
              </p>
            </div>
            <div className="mt-4 md:mt-0">
              <span className="pill inline-flex items-center lhs-mono text-xs" style={{ padding: "8px 14px", gap: "8px" }}>
                <span className="dot-live" />
                Current Term: 2026 Academic Year
              </span>
            </div>
          </div>
        </Reveal>

        <div className="grid lg:grid-cols-12" style={{ gap: "28px" }}>
          {/* Fee Estimator & Bank Info */}
          <Reveal className="lg:col-span-5" delay={150} style={{ gridColumn: "span 5" }}>
            <SpotlightCard className="p-6 h-full flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between" style={{ marginBottom: "20px" }}>
                  <span className="tile-label text-tertiary">Fee Breakdown & Bank Accounts</span>
                  <Receipt size={16} className="text-accent" />
                </div>

                {/* Grade Fee Selector */}
                <div style={{ marginBottom: "16px" }}>
                  <label className="text-secondary text-xs block mb-2">Grade Level</label>
                  <div className="flex gap-2">
                    {GRADES.map((g) => (
                      <button
                        key={g}
                        type="button"
                        onClick={() => setGrade(g)}
                        className={`grade-chip lhs-mono text-xs flex-1 ${grade === g ? "active" : ""}`}
                      >
                        Gr. {g}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Optional Addons */}
                <div className="space-y-2 mb-6" style={{ background: "rgba(10,30,20,0.3)", padding: "12px", borderRadius: "10px", border: "1px solid var(--border-glass)" }}>
                  <div className="text-xs text-tertiary mb-1 font-semibold">Optional Add-on Services:</div>
                  <label className="flex items-center justify-between text-xs text-secondary cursor-pointer">
                    <span className="flex items-center gap-2">
                      <input
                        type="checkbox"
                        checked={includeBus}
                        onChange={(e) => setIncludeBus(e.target.checked)}
                        className="rounded accent-emerald-500"
                      />
                      Bus Transport (Monthly)
                    </span>
                    <span className="lhs-mono text-primary">+1,200 ETB</span>
                  </label>
                  <label className="flex items-center justify-between text-xs text-secondary cursor-pointer">
                    <span className="flex items-center gap-2">
                      <input
                        type="checkbox"
                        checked={includeMeals}
                        onChange={(e) => setIncludeMeals(e.target.checked)}
                        className="rounded accent-emerald-500"
                      />
                      Lunch & Snack Program
                    </span>
                    <span className="lhs-mono text-primary">+1,500 ETB</span>
                  </label>
                </div>

                {/* Amount Total Card */}
                <div className="glass p-4 rounded-xl border border-[var(--border-glass-hover)] mb-6">
                  <div className="flex justify-between text-xs text-tertiary mb-1">
                    <span>Base Tuition (Grade {grade}):</span>
                    <span className="lhs-mono">{baseTuition.toLocaleString()} ETB</span>
                  </div>
                  {includeBus && (
                    <div className="flex justify-between text-xs text-tertiary mb-1">
                      <span>Bus Transport:</span>
                      <span className="lhs-mono">1,200 ETB</span>
                    </div>
                  )}
                  {includeMeals && (
                    <div className="flex justify-between text-xs text-tertiary mb-1">
                      <span>Meal Plan:</span>
                      <span className="lhs-mono">1,500 ETB</span>
                    </div>
                  )}
                  <div className="border-t border-dashed border-[var(--border-glass)] my-2 pt-2 flex justify-between items-center">
                    <span className="text-sm text-primary font-semibold">Total Monthly Due:</span>
                    <span className="lhs-mono gradient-text text-xl font-bold">{totalAmount.toLocaleString()} ETB</span>
                  </div>
                </div>

                {/* Bank Selector */}
                <div>
                  <label className="text-secondary text-xs block mb-2">Select Transfer Method</label>
                  <div className="grid grid-cols-2 gap-2 mb-3">
                    {PAYMENT_METHODS.map((b) => (
                      <button
                        key={b.id}
                        type="button"
                        onClick={() => setSelectedBank(b.id)}
                        className={`chip lhs-mono text-xs text-left py-2 px-3 ${selectedBank === b.id ? "active" : ""}`}
                      >
                        {b.name.split(" ")[0]}
                      </button>
                    ))}
                  </div>

                  <div className="p-3 rounded-lg bg-black/40 border border-[var(--border-glass)] flex items-center justify-between">
                    <div>
                      <div className="text-[11px] text-tertiary">{activeBank.name} ({activeBank.type})</div>
                      <div className="lhs-mono text-primary text-sm font-semibold">{activeBank.acc}</div>
                    </div>
                    <button
                      type="button"
                      onClick={() => handleCopy(activeBank.acc)}
                      className="btn-glass p-2 text-xs flex items-center gap-1"
                      title="Copy Account Number"
                    >
                      {copied ? <Check size={14} className="text-emerald-400" /> : <Copy size={14} />}
                      <span className="hidden sm:inline">{copied ? "Copied" : "Copy"}</span>
                    </button>
                  </div>
                </div>
              </div>

              <div className="text-[11.5px] text-tertiary mt-6 flex items-center gap-2">
                <ShieldCheck size={14} className="text-accent flex-shrink-0" />
                Payments are processed and verified within 24 hours of receipt submission.
              </div>
            </SpotlightCard>
          </Reveal>

          {/* Payment Form */}
          <Reveal className="lg:col-span-7 glass" delay={300} style={{ gridColumn: "span 7", borderRadius: "20px", padding: "28px" }}>
            {!submitted ? (
              <form onSubmit={handlePaymentSubmit} className="space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-[var(--border-glass)] mb-4">
                  <h3 className="text-primary text-base font-semibold">Submit Fee Payment Proof</h3>
                  <span className="lhs-mono text-xs text-accent">FormSubmit Direct Sync</span>
                </div>

                <div className="grid sm:grid-cols-2 gap-4">
                  <Field label="Student ID Number" error={errors.studentId}>
                    <input
                      className={`field lhs-mono ${errors.studentId ? "error" : ""}`}
                      placeholder="e.g. LHS-2024-019"
                      value={studentId}
                      onChange={(e) => setStudentId(e.target.value)}
                    />
                  </Field>

                  <Field label="Student Full Name" error={errors.studentName}>
                    <input
                      className={`field ${errors.studentName ? "error" : ""}`}
                      placeholder="e.g. Abebe Bikila"
                      value={studentName}
                      onChange={(e) => setStudentName(e.target.value)}
                    />
                  </Field>
                </div>

                <div className="grid sm:grid-cols-2 gap-4">
                  <Field label="Paying for Month">
                    <select
                      className="field lhs-mono bg-[#06120b]"
                      value={selectedMonth}
                      onChange={(e) => setSelectedMonth(e.target.value)}
                    >
                      {MONTHS.map((m) => (
                        <option key={m} value={m}>{m}</option>
                      ))}
                    </select>
                  </Field>

                  <Field label="Bank Transaction Ref / FT Number" error={errors.refNum}>
                    <input
                      className={`field lhs-mono ${errors.refNum ? "error" : ""}`}
                      placeholder="e.g. FT26209XXXXX"
                      value={refNum}
                      onChange={(e) => setRefNum(e.target.value)}
                    />
                  </Field>
                </div>

                <Field label="Upload Payment Screenshot or Receipt Slip" error={errors.receiptFile}>
                  <div className={`dropzone p-4 ${errors.receiptFile ? "error" : ""}`}>
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span className="doc-icon">
                          <Receipt size={16} className="text-accent" />
                        </span>
                        <div>
                          <div className="text-primary text-xs font-medium">
                            {receiptFile ? receiptFile.name : "Select or drag bank slip / Telebirr receipt"}
                          </div>
                          <div className="text-tertiary text-[11px]">JPG, PNG, PDF up to 10MB</div>
                        </div>
                      </div>
                      <label className="btn-glass upload-btn lhs-mono cursor-pointer">
                        <UploadCloud size={13} />
                        {receiptFile ? "Change" : "Browse"}
                        <input type="file" accept="image/*,.pdf" className="hidden" onChange={handleFileSelect} />
                      </label>
                    </div>
                    {receiptFile && uploadProgress > 0 && (
                      <div className="upload-track mt-3">
                        <div className="upload-fill" style={{ width: `${uploadProgress}%` }} />
                      </div>
                    )}
                  </div>
                </Field>

                {errors.submit && (
                  <div className="text-red-400 text-xs flex items-center gap-1">
                    <X size={14} /> {errors.submit}
                  </div>
                )}

                <div className="pt-2 flex items-center justify-between">
                  <div className="text-xs text-tertiary">
                    Amount being paid: <strong className="text-primary lhs-mono">{totalAmount.toLocaleString()} ETB</strong>
                  </div>
                  <button
                    type="submit"
                    disabled={submitting}
                    className="btn-primary py-2.5 px-6 text-sm flex items-center gap-2"
                  >
                    {submitting ? (
                      <>
                        <Loader2 size={16} className="animate-spin" /> Submitting...
                      </>
                    ) : (
                      <>
                        Submit Monthly Fee Payment <ChevronRight size={16} />
                      </>
                    )}
                  </button>
                </div>
              </form>
            ) : (
              <div className="ticket animate-scale-up">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-3">
                    <span className="ticket-check">
                      <CheckCircle2 size={20} />
                    </span>
                    <div>
                      <div className="text-primary text-base font-semibold">Monthly Payment Received</div>
                      <div className="text-tertiary text-xs">Payment verification pending</div>
                    </div>
                  </div>
                  <span className="lhs-mono text-accent text-sm font-bold">{receiptRef}</span>
                </div>

                <div className="ticket-divider mb-4" />

                <div className="grid sm:grid-cols-2 gap-3 py-2 text-xs">
                  <div>
                    <span className="text-tertiary block">Student Name:</span>
                    <span className="text-primary font-medium">{studentName}</span>
                  </div>
                  <div>
                    <span className="text-tertiary block">Student ID:</span>
                    <span className="text-primary lhs-mono">{studentId}</span>
                  </div>
                  <div>
                    <span className="text-tertiary block">Month Paid:</span>
                    <span className="text-primary font-medium">{selectedMonth}</span>
                  </div>
                  <div>
                    <span className="text-tertiary block">Payment Method:</span>
                    <span className="text-primary">{activeBank.name}</span>
                  </div>
                  <div>
                    <span className="text-tertiary block">Transaction Ref:</span>
                    <span className="text-primary lhs-mono">{refNum}</span>
                  </div>
                  <div>
                    <span className="text-tertiary block">Total Paid:</span>
                    <span className="text-primary lhs-mono font-bold text-emerald-400">{totalAmount.toLocaleString()} ETB</span>
                  </div>
                </div>

                <div className="ticket-divider my-4" />

                <div className="flex items-center justify-between">
                  <span className="text-tertiary text-xs flex items-center gap-1.5">
                    <Calendar size={13} /> SMS receipt confirmation will be sent shortly.
                  </span>
                  <button
                    onClick={() => {
                      setSubmitted(false);
                      setReceiptFile(null);
                      setRefNum("");
                    }}
                    className="btn-glass text-xs py-1.5 px-3"
                  >
                    Make Another Payment
                  </button>
                </div>
              </div>
            )}
          </Reveal>
        </div>
      </div>
    </section>
  );
}
